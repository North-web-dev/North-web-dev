<svg width="1200" height="600" viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <radialGradient id="scrim" cx="50%" cy="50%" r="55%">
      <stop offset="0"   stop-color="#060d18" stop-opacity="0.72"/>
      <stop offset="0.6" stop-color="#060d18" stop-opacity="0.5"/>
      <stop offset="1"   stop-color="#060d18" stop-opacity="0"/>
    </radialGradient>
    <filter id="ds" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#030812" flood-opacity="0.75"/>
    </filter>
    <linearGradient id="vignette" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0"   stop-color="#05101c" stop-opacity="0.55"/>
      <stop offset="0.3" stop-color="#05101c" stop-opacity="0.12"/>
      <stop offset="1"   stop-color="#05101c" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- AI-generated ukiyo-e background -->
  <image xlink:href="hero-bg.png" x="0" y="0" width="1200" height="600" preserveAspectRatio="xMidYMid slice"/>
  <rect width="1200" height="600" fill="url(#vignette)"/>

  <!-- scrim behind title for legibility -->
  <ellipse cx="892" cy="408" rx="360" ry="156" fill="url(#scrim)"/>

  <!-- vermilion ensō + kanji -->
  <circle cx="600" cy="382" r="60" fill="#e34234" opacity="0.16"/>
  <circle cx="600" cy="382" r="60" fill="none" stroke="#e34234" stroke-width="1.6" opacity="0.5"/>
  <text x="600" y="412" text-anchor="middle" font-family="'Yu Mincho','Hiragino Mincho ProN','Noto Serif CJK JP',serif" font-size="78" font-weight="700" fill="#e34234" opacity="0.95">北</text>

  <!-- title (manual shadow: dark copy offset behind) -->
  <text x="917" y="401" text-anchor="middle" font-family="'Yu Gothic','Hiragino Kaku Gothic ProN',system-ui,sans-serif" font-size="62" font-weight="800" letter-spacing="1.5" fill="#030812" opacity="0.7">North-web-dev</text>
  <text x="916" y="398" text-anchor="middle" font-family="'Yu Gothic','Hiragino Kaku Gothic ProN',system-ui,sans-serif" font-size="62" font-weight="800" letter-spacing="1.5" fill="#f6ecd6">North-web-dev</text>
  <text x="916" y="432" text-anchor="middle" font-family="'Yu Mincho',serif" font-size="17" letter-spacing="11" fill="#e0cf9f">北 海  ·  K I T A K A I</text>
  <!-- gold divider -->
  <g stroke="#d9a441" stroke-width="1.2" opacity="0.7">
    <line x1="724" y1="450" x2="856" y2="450"/>
    <line x1="976" y1="450" x2="1108" y2="450"/>
  </g>
  <path d="M916,444 l7,6 -7,6 -7,-6 Z" fill="#e34234" opacity="0.9"/>
  <text x="916" y="476" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="14.5" letter-spacing="0.3" fill="#c3d4e1">reverse engineering the wire · byte-exact, or detectable</text>

  <!-- hanko seal -->
  <g transform="translate(1108,506)">
    <rect x="0" y="0" width="48" height="48" rx="6" fill="#e34234"/>
    <rect x="4" y="4" width="40" height="40" rx="4" fill="none" stroke="#fbe9df" stroke-width="1.4"/>
    <text x="24" y="22" text-anchor="middle" font-family="'Yu Mincho',serif" font-size="16" font-weight="700" fill="#fbe9df">北斎</text>
    <text x="24" y="40" text-anchor="middle" font-family="'Yu Mincho',serif" font-size="12.5" fill="#fbe9df" opacity="0.92">の波</text>
  </g>

  <!-- gold hairline frame -->
  <rect x="7" y="7" width="1186" height="586" rx="12" fill="none" stroke="#d9a441" stroke-width="1.2" opacity="0.5"/>
</svg>
