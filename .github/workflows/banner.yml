name: Refresh banner

on:
  schedule:
    - cron: "17 6 * * *"   # daily ~06:17 UTC
  workflow_dispatch:
  push:
    paths:
      - ".github/scripts/banner.py"
      - ".github/workflows/banner.yml"

permissions:
  contents: write

concurrency:
  group: refresh-banner
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends librsvg2-bin fonts-noto-cjk fonts-dejavu-core
          python3 -m pip install --quiet pillow

      - name: Render banner
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/banner.py

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain assets2/banner.png assets2/banner.svg)" ]; then
            git config user.name  "North-web-dev"
            git config user.email "iskandarkhon1221@gmail.com"
            git add assets2/banner.png assets2/banner.svg
            git commit -m "chore: refresh profile banner (live stats)"
            git push
          else
            echo "banner unchanged"
          fi
