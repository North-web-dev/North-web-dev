<svg width="1160" height="270" viewBox="0 0 1160 270" fill="none" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-label="Three tracks: the wire (TLS/JA3, HTTP/2, MTProto), quiet automation (monitors, snipers, solvers), shipped products (storefronts, legal search, comparison platforms)"
     font-family="'Segoe UI','Helvetica Neue',system-ui,sans-serif">
  <defs>
    <linearGradient id="colbg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#1c1026"/><stop offset="1" stop-color="#120a17"/>
    </linearGradient>
    <radialGradient id="colglow" cx="50%" cy="0%" r="80%">
      <stop offset="0" stop-color="#d9455f" stop-opacity="0.22"/><stop offset="1" stop-color="#d9455f" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="col"><rect width="366" height="270" rx="16"/></clipPath>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9455f"/><stop offset="1" stop-color="#e6a23c" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <g>
    <!-- ── the wire ─────────────────────────────────────────────── -->
    <g transform="translate(0,0)">
      <rect width="366" height="270" rx="16" fill="url(#colbg)" stroke="#3a1c33"/>
      <g clip-path="url(#col)">
        <rect width="366" height="270" rx="16" fill="url(#colglow)"/>
        <text x="352" y="252" text-anchor="end" font-size="86" font-weight="700" fill="#f5a9c1" opacity="0.055">電線</text>
      </g>

      <rect x="26" y="26" width="46" height="46" rx="12" fill="#241430" stroke="#5a3350"/>
      <!-- handshake: two peers, a packet between them -->
      <g stroke="#f5a9c1" stroke-width="2" fill="none" stroke-linecap="round">
        <path d="M38 44 h6"/><path d="M54 44 h6"/>
      </g>
      <rect x="45" y="40" width="8" height="8" rx="2" fill="#d9455f"/>
      <g stroke="#e6a23c" stroke-width="1.6" opacity="0.8"><path d="M38 56 h22"/></g>

      <text x="88" y="46" font-size="17" font-weight="700" fill="#f6ebf0">the wire</text>
      <text x="88" y="65" font-size="11.5" font-weight="600" letter-spacing="2" fill="#f5a9c1" opacity="0.75">電線 · PROTOCOL RE</text>
      <rect x="26" y="86" width="120" height="2" rx="1" fill="url(#rule)"/>

      <g font-size="13" fill="#c7abbb">
        <text x="26" y="116">TLS ClientHello · JA3 / JA4</text>
        <text x="26" y="140">HTTP/2 frames · Akamai order</text>
        <text x="26" y="164">MTProto · FakeTLS fronting</text>
        <text x="26" y="188">uTLS in Go, curl_cffi in Python</text>
      </g>
      <text x="26" y="224" font-size="12" font-style="italic" fill="#8d7186">if it isn't byte-exact,</text>
      <text x="26" y="242" font-size="12" font-style="italic" fill="#8d7186">it's detectable</text>
    </g>

    <!-- ── quiet automation ─────────────────────────────────────── -->
    <g transform="translate(397,0)">
      <rect width="366" height="270" rx="16" fill="url(#colbg)" stroke="#3a1c33"/>
      <g clip-path="url(#col)">
        <rect width="366" height="270" rx="16" fill="url(#colglow)"/>
        <text x="352" y="252" text-anchor="end" font-size="86" font-weight="700" fill="#f5a9c1" opacity="0.055">静動</text>
      </g>

      <rect x="26" y="26" width="46" height="46" rx="12" fill="#241430" stroke="#5a3350"/>
      <!-- a watch loop: circle with a tick hand -->
      <circle cx="49" cy="49" r="13" fill="none" stroke="#f5a9c1" stroke-width="2"/>
      <path d="M49 41 v8 l6 4" stroke="#e6a23c" stroke-width="2" fill="none" stroke-linecap="round"/>
      <circle cx="49" cy="49" r="2" fill="#d9455f"/>

      <text x="88" y="46" font-size="17" font-weight="700" fill="#f6ebf0">quiet automation</text>
      <text x="88" y="65" font-size="11.5" font-weight="600" letter-spacing="2" fill="#f5a9c1" opacity="0.75">せいどう · WATCH &amp; ACT</text>
      <rect x="26" y="86" width="120" height="2" rx="1" fill="url(#rule)"/>

      <g font-size="13" fill="#c7abbb">
        <text x="26" y="116">slot monitors that hold the slot</text>
        <text x="26" y="140">challenge solving, locally</text>
        <text x="26" y="164">account &amp; proxy pools, rotation</text>
        <text x="26" y="188">Telegram as the control surface</text>
      </g>
      <text x="26" y="224" font-size="12" font-style="italic" fill="#8d7186">polite rate, real headers,</text>
      <text x="26" y="242" font-size="12" font-style="italic" fill="#8d7186">no paid captcha API</text>
    </g>

    <!-- ── shipped products ─────────────────────────────────────── -->
    <g transform="translate(794,0)">
      <rect width="366" height="270" rx="16" fill="url(#colbg)" stroke="#3a1c33"/>
      <g clip-path="url(#col)">
        <rect width="366" height="270" rx="16" fill="url(#colglow)"/>
        <text x="352" y="252" text-anchor="end" font-size="86" font-weight="700" fill="#f5a9c1" opacity="0.055">製品</text>
      </g>

      <rect x="26" y="26" width="46" height="46" rx="12" fill="#241430" stroke="#5a3350"/>
      <!-- a shipped box -->
      <path d="M37 44 L49 38 L61 44 V58 L49 64 L37 58 Z" fill="none" stroke="#f5a9c1" stroke-width="2" stroke-linejoin="round"/>
      <path d="M37 44 L49 50 L61 44" stroke="#e6a23c" stroke-width="1.8" fill="none"/>
      <path d="M49 50 V64" stroke="#d9455f" stroke-width="1.8"/>

      <text x="88" y="46" font-size="17" font-weight="700" fill="#f6ebf0">shipped products</text>
      <text x="88" y="65" font-size="11.5" font-weight="600" letter-spacing="2" fill="#f5a9c1" opacity="0.75">せいひん · IN PRODUCTION</text>
      <rect x="26" y="86" width="120" height="2" rx="1" fill="url(#rule)"/>

      <g font-size="13" fill="#c7abbb">
        <text x="26" y="116">storefronts with real checkout</text>
        <text x="26" y="140">legal search over 178k documents</text>
        <text x="26" y="164">evidence-based comparison</text>
        <text x="26" y="188">Next.js · Prisma · Postgres</text>
      </g>
      <text x="26" y="224" font-size="12" font-style="italic" fill="#8d7186">money paths get tests</text>
      <text x="26" y="242" font-size="12" font-style="italic" fill="#8d7186">before they get traffic</text>
    </g>
  </g>
</svg>
