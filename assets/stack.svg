<svg width="700" height="160" viewBox="0 0 700 160" fill="none" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-label="Stack: Go, Python, TypeScript, C# / .NET, uTLS, curl_cffi, HTTP/2, TLS · JA3, Playwright, Next.js, Prisma · Postgres, PyTorch"
     font-family="ui-monospace,'JetBrains Mono','Segoe UI',monospace">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#221430"/><stop offset="1" stop-color="#160d1a"/>
    </linearGradient>
  </defs>

  <g font-size="13.5" font-weight="600">
    <!-- languages -->
    <g transform="translate(0,4)">
      <rect x="0"   y="0" width="150" height="40" rx="10" fill="url(#chip)" stroke="#3a1c33"/>
      <circle cx="20" cy="20" r="4.5" fill="#00ADD8"/><text x="36" y="25" fill="#e9d3dd">Go</text>
      <rect x="162" y="0" width="150" height="40" rx="10" fill="url(#chip)" stroke="#3a1c33"/>
      <circle cx="182" cy="20" r="4.5" fill="#3572A5"/><text x="198" y="25" fill="#e9d3dd">Python</text>
      <rect x="324" y="0" width="164" height="40" rx="10" fill="url(#chip)" stroke="#3a1c33"/>
      <circle cx="344" cy="20" r="4.5" fill="#3178c6"/><text x="360" y="25" fill="#e9d3dd">TypeScript</text>
      <rect x="500" y="0" width="200" height="40" rx="10" fill="url(#chip)" stroke="#3a1c33"/>
      <circle cx="520" cy="20" r="4.5" fill="#f5a9c1"/><text x="536" y="25" fill="#e9d3dd">C# / .NET</text>
    </g>

    <!-- the wire -->
    <g transform="translate(0,58)">
      <rect x="0"   y="0" width="150" height="40" rx="10" fill="url(#chip)" stroke="#3a1c33"/>
      <circle cx="20" cy="20" r="4.5" fill="#d9455f"/><text x="36" y="25" fill="#e9d3dd">uTLS</text>
      <rect x="162" y="0" width="150" height="40" rx="10" fill="url(#chip)" stroke="#3a1c33"/>
      <circle cx="182" cy="20" r="4.5" fill="#d9455f"/><text x="198" y="25" fill="#e9d3dd">curl_cffi</text>
      <rect x="324" y="0" width="164" height="40" rx="10" fill="url(#chip)" stroke="#3a1c33"/>
      <circle cx="344" cy="20" r="4.5" fill="#e6a23c"/><text x="360" y="25" fill="#e9d3dd">HTTP/2</text>
      <rect x="500" y="0" width="200" height="40" rx="10" fill="url(#chip)" stroke="#3a1c33"/>
      <circle cx="520" cy="20" r="4.5" fill="#f5a9c1"/><text x="536" y="25" fill="#e9d3dd">TLS · JA3 / JA4</text>
    </g>

    <!-- product side -->
    <g transform="translate(0,112)">
      <rect x="0"   y="0" width="150" height="40" rx="10" fill="url(#chip)" stroke="#3a1c33"/>
      <circle cx="20" cy="20" r="4.5" fill="#f5a9c1"/><text x="36" y="25" fill="#e9d3dd">Next.js</text>
      <rect x="162" y="0" width="150" height="40" rx="10" fill="url(#chip)" stroke="#3a1c33"/>
      <circle cx="182" cy="20" r="4.5" fill="#e6a23c"/><text x="198" y="25" fill="#e9d3dd">Postgres</text>
      <rect x="324" y="0" width="164" height="40" rx="10" fill="url(#chip)" stroke="#3a1c33"/>
      <circle cx="344" cy="20" r="4.5" fill="#d9455f"/><text x="360" y="25" fill="#e9d3dd">Playwright</text>
      <rect x="500" y="0" width="200" height="40" rx="10" fill="url(#chip)" stroke="#3a1c33"/>
      <circle cx="520" cy="20" r="4.5" fill="#e6a23c"/><text x="536" y="25" fill="#e9d3dd">PyTorch</text>
    </g>
  </g>
</svg>
